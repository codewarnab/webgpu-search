name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate WGSL Shaders (vgpu check)
        run: bun run check:shaders

      - name: Lint Parity Invariants
        run: bun run lint:parity

      - name: Lint Naming Hygiene
        run: bun run lint:naming

      - name: Verify Case-Fold Table Freshness
        run: bun scripts/generate-case-fold-table.ts --check

      - name: Typecheck Workspaces
        run: bun run typecheck

      - name: Typecheck Framework Examples
        run: bun x tsc -p examples/tsconfig.json --noEmit

      - name: Production Build (Turborepo)
        run: bun run build

      - name: Check Bundle Size Budget
        run: bun run check:bundle-size

      - name: Check Public API Surface (Phase 0 freeze)
        run: bun run check:public-api

      - name: Resolve Package Types (attw)
        run: bunx --bun @arethetypeswrong/cli --pack ./packages/webgpu-search

      - name: Validate Snapshot Benchmark Matrix (headless)
        run: bun scripts/bench-snapshot-matrix.ts --out /tmp/benchmark_snapshot_matrix.json

      - name: Run Text-Normalization Tests
        run: bun run test:normalization

      - name: Run Text-Normalization Tests Under tr-TR Locale
        run: bun run test:normalization:tr

      - name: Run Headless WebGPU Mock Tests (vgpu/mock)
        run: bun run test:headless

      - name: Run Public Contract Tests
        run: bun run test:contracts

      - name: Run Document Record Engine Tests
        run: bun run test:records

      - name: Run Unicode-Safe Highlighting Tests
        run: bun run test:highlight

      - name: Run Dynamic Mutations & Memory Management Tests
        run: bun run test:mutations

      - name: Run Worker Client & Protocol Tests
        run: bun run test:worker

      - name: Run Snapshot Persistence & IndexedDB Tests
        run: bun run test:snapshot

      - name: Run Observability & Framework Recipe Tests
        run: bun run test:observability

      - name: Run Proof Applications & Acceptance Tests
        run: bun run test:proof-apps


      - name: Run Parity Harness (differential + fallback + worker)
        timeout-minutes: 10
        # Single-shard in CI; PARITY_SHARD_* sharding is local-only (validated
        # fail-closed in-harness: bad env or empty shard exits non-zero).
        run: bun run test:parity

      - name: Run Structured Filter Tests
        run: bun run test:filtering

      - name: Run Facet Aggregation Tests
        run: bun run test:faceting

      - name: Run Query Diagnostics Tests
        run: bun run test:diagnostics

      - name: Run Token/Prefix/Typo Search-Mode Tests
        run: bun run test:search-modes

      - name: Run CPU Baseline Pin (support-matrix reference contract)
        run: bun run test:cpu-baseline

      - name: Setup Chrome (browser regression gate)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Browser WebGPU Regression Tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          # NOTE: `bun --cwd <dir> run dev -- …` is rejected by bun 1.4.2
          # (prints help, exit 1); plain `cd` avoids the CLI quirk.
          (cd "$GITHUB_WORKSPACE/apps/benchmark" && bun run dev -- --host 127.0.0.1 --port 5173 > "$GITHUB_WORKSPACE/browser-server.log" 2>&1) &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          # Prefer the setup-chrome step output (absolute path, always set);
          # fall back to PATH lookup for self-hosted / local `act` runs.
          CHROME_BIN="${{ steps.setup-chrome.outputs.chrome-path }}"
          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chrome || echo \"${CHROME_PATH:-}\")"
          fi
          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            echo "Chrome/Chromium binary not found or not executable (got '${CHROME_BIN:-<empty>}'); failing browser regression gate." >&2
            exit 1
          fi
          export CHROME_BIN
          echo "Waiting for benchmark dev server on http://127.0.0.1:5173/ ..."
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null 2>&1; then
              echo "Dev server is up."
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Dev server process exited before becoming ready. See browser-server.log:" >&2
              tail -n 50 browser-server.log >&2 || true
              exit 1
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for dev server. See browser-server.log:" >&2
              tail -n 50 browser-server.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          timeout 4m bun run test:browser 2>&1 | tee browser-test.log

      - name: Upload Browser Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-logs
          path: |
            browser-server.log
            browser-test.log
          if-no-files-found: warn
          retention-days: 7
