name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate WGSL Shaders (vgpu check)
        run: bun run check:shaders

      - name: Lint Parity Invariants (M2)
        run: bun run lint:parity

      - name: Verify Fold Table Freshness (M2)
        run: bun scripts/generate-fold-table.ts --check

      - name: Typecheck Workspaces
        run: bun run typecheck

      - name: Typecheck Framework Examples
        run: bun x tsc -p examples/tsconfig.json --noEmit

      - name: Production Build (Turborepo)
        run: bun run build

      - name: Check Bundle Size Budget (M2)
        run: bun run check:bundle

      - name: Run M2 Preprocessing and Parity Tests
        run: bun run test:preprocess

      - name: Run M2 Tests Under tr-TR Locale
        run: LANG=tr_TR.UTF-8 LC_ALL=tr_TR.UTF-8 bun run test:preprocess

      - name: Run Headless WebGPU Mock Tests (vgpu/mock)
        run: bun run test:mock

      - name: Run Milestone 1 Public Contract Tests
        run: bun run test:m1

      - name: Run Milestone 2 Document Record Engine Tests
        run: bun run test:m2

      - name: Run Milestone 3 Unicode-Safe Highlighting Tests
        run: bun run test:m3

      - name: Run Milestone 4 Dynamic Mutations & Memory Management Tests
        run: bun run test:m4

      - name: Run Milestone 5 Worker Client & Protocol Tests
        run: bun run test:m5

      - name: Run Milestone 6 Snapshot Persistence & IndexedDB Tests
        run: bun run test:m6

      - name: Run Milestone 7 Observability & Framework Recipe Tests
        run: bun run test:m7

      - name: Run Milestone 8 Proof Applications & Acceptance Tests
        run: bun run test:m8


      - name: Run M4 Parity Harness (differential + fallback + worker)
        timeout-minutes: 10
        # Single-shard in CI; M4_SHARD_* sharding is local-only (validated
        # fail-closed in-harness: bad env or empty shard exits non-zero).
        run: bun run test:parity

      - name: Run M2 Structured Filter Tests
        run: bun run test:filter

      - name: Run M3 Facet Aggregation Tests
        run: bun run test:facets

      - name: Setup Chrome (browser regression gate)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run Browser WebGPU Regression Tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          # NOTE: `bun --cwd <dir> run dev -- …` is rejected by bun 1.4.2
          # (prints help, exit 1); plain `cd` avoids the CLI quirk.
          (cd "$GITHUB_WORKSPACE/apps/benchmark" && bun run dev -- --host 127.0.0.1 --port 5173 > "$GITHUB_WORKSPACE/browser-server.log" 2>&1) &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          # Prefer the setup-chrome step output (absolute path, always set);
          # fall back to PATH lookup for self-hosted / local `act` runs.
          CHROME_BIN="${{ steps.setup-chrome.outputs.chrome-path }}"
          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chrome || echo \"${CHROME_PATH:-}\")"
          fi
          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            echo "Chrome/Chromium binary not found or not executable (got '${CHROME_BIN:-<empty>}'); failing browser regression gate." >&2
            exit 1
          fi
          export CHROME_BIN
          echo "Waiting for benchmark dev server on http://127.0.0.1:5173/ ..."
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null 2>&1; then
              echo "Dev server is up."
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Dev server process exited before becoming ready. See browser-server.log:" >&2
              tail -n 50 browser-server.log >&2 || true
              exit 1
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for dev server. See browser-server.log:" >&2
              tail -n 50 browser-server.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          timeout 4m bun run test:browser 2>&1 | tee browser-test.log

      - name: Upload Browser Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-logs
          path: |
            browser-server.log
            browser-test.log
          if-no-files-found: warn
          retention-days: 7
