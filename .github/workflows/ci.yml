name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate WGSL Shaders (vgpu check)
        run: bun run check:shaders

      - name: Typecheck Workspaces
        run: bun run typecheck

      - name: Production Build (Turborepo)
        run: bun run build

      - name: Run Headless WebGPU Mock Tests (vgpu/mock)
        run: bun run test:mock

      - name: Run Browser WebGPU Regression Tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -o pipefail
          bun --cwd apps/benchmark run dev --host 127.0.0.1 --port 5173 > browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          CHROME_BIN="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Chrome/Chromium binary not found; failing browser regression gate." >&2
            exit 1
          fi
          export CHROME_BIN
          echo "Waiting for benchmark dev server on http://127.0.0.1:5173/ ..."
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5173/ > /dev/null 2>&1; then
              echo "Dev server is up."
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Dev server process exited before becoming ready. See browser-server.log:" >&2
              tail -n 50 browser-server.log >&2 || true
              exit 1
            fi
            if [ "$i" -eq 60 ]; then
              echo "Timed out waiting for dev server. See browser-server.log:" >&2
              tail -n 50 browser-server.log >&2 || true
              exit 1
            fi
            sleep 1
          done
          timeout 4m bun run test:browser 2>&1 | tee browser-test.log

      - name: Upload Browser Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-logs
          path: |
            browser-server.log
            browser-test.log
          if-no-files-found: warn
          retention-days: 7
