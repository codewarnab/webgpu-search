name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Validate WGSL Shaders (vgpu check)
        run: bun run check:shaders

      - name: Run WebGPU Mock Tests (vgpu/mock)
        run: bun run test:mock

      - name: Typecheck and Production Build
        run: bun run build
